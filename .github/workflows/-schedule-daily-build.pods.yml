name: daily-build/pods | schedule

on:
  schedule:
    - cron: '30 23 * * 0,3,5'

jobs:
  # v0xFE-apps-pods
  accounts:
    name: scheduler | accounts
    uses: vezham/vx-fe-deployer/.github/workflows/accounts.yml@timeline
    secrets: inherit
    with:
      CALLER: scheduler

  business:
    name: scheduler | business
    uses: vezham/vx-fe-deployer/.github/workflows/business.yml@timeline
    secrets: inherit
    with:
      CALLER: scheduler

  iam:
    name: scheduler | iam
    uses: vezham/vx-fe-deployer/.github/workflows/iam.yml@timeline
    secrets: inherit
    with:
      CALLER: scheduler
