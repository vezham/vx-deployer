name: 🏗️ Web app • Build & deploy
on:
  workflow_call:
    secrets:
      SOURCE_APP_PRIVATE_KEY:
        required: false
      GCP_SA_KEY:
        required: true
      HEROUI_AUTH_TOKEN:
        required: true
      BUILD_SECRETS:
        description: Secret JSON for referenced build values
        required: false
    inputs:
      APP_NAME:
        required: true
        type: string
      GIT_REPO:
        required: true
        type: string
      APP_PATH:
        required: true
        type: string
      GIT_REF:
        required: true
        type: string
      TRACK_ENV:
        description: Source tracker environment (tva, dev, qa, preview or production)
        required: true
        type: string
      APP_ENV:
        description: Build-time environment
        required: true
        type: string
      RELEASE_CHANNEL:
        required: true
        type: string
      IS_DEBUG:
        required: true
        type: boolean
      JOURNAL_REPO:
        required: true
        type: string
      PRODUCTION_TARGET:
        type: string
        default: ''
      BUILD_VALUES:
        type: string
        default: '{}'
      BUILD_SECRET_VALUES:
        type: string
        default: '{}'
      JOURNAL_ISSUE:
        type: string
        default: ''
      IS_REBUILD:
        description: Routine rebuild of an already successful Production SHA
        type: boolean
        default: false
      CATEGORY:
        description: Registry category for monthly history
        required: true
        type: string
env:
  REPO: ${{ inputs.GIT_REPO }}
  BRANCH: ${{ inputs.GIT_REF }}
  ENTRY_POINT: ./${{ inputs.APP_PATH }}
  VX_APP_PATH: ${{ inputs.APP_PATH }}
  VX_APP_NAME: ${{ inputs.APP_NAME }}
  DEPLOYMENT_JOURNAL_REPO: ${{ inputs.JOURNAL_REPO }}
  NX_NO_CLOUD: 'true'
jobs:
  bnd:
    name: 🏗️ Build & deploy • ${{ inputs.APP_NAME }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.ENTRY_POINT }}
    steps:
      - name: 🔵 · ✅ Validate rebuild mode
        uses: actions/github-script@v7
        env:
          TRACK_ENV: ${{ inputs.TRACK_ENV }}
          IS_REBUILD: ${{ inputs.IS_REBUILD }}
        with:
          script: |
            if (!['tva', 'dev', 'qa', 'preview', 'production'].includes(process.env.TRACK_ENV)) throw new Error('Invalid tracking environment');
            if (process.env.IS_REBUILD === 'true' && process.env.TRACK_ENV !== 'production') throw new Error('Routine rebuilds require Production');
      - name: 🟠 · ✅ Validate deployment settings
        uses: vezham/vx-deployer/.github/actions/deployment/validate@timeline
        with:
          APP_ENV: ${{ inputs.APP_ENV }}
          RELEASE_CHANNEL: ${{ inputs.RELEASE_CHANNEL }}
      - name: 🟠 · 🔐 Authenticate source repository
        id: source-auth
        uses: vezham/vx-deployer/.github/actions/common/setup-source-auth@timeline
        with:
          GIT_REPO: ${{ env.REPO }}
          APP_CLIENT_ID: ${{ vars.SOURCE_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.SOURCE_APP_PRIVATE_KEY }}
      - name: 🟠 · 🧰 Checkout • ${{ env.REPO }}@${{ env.BRANCH }}
        uses: vezham/vx-deployer/.github/actions/common/setup-checkout@timeline
        with:
          GIT_REPO: ${{ env.REPO }}
          GIT_BRANCH: ${{ env.BRANCH }}
          GIT_TOKEN: ${{ steps.source-auth.outputs.token }}
      - name: 🔵 · 🔎 Resolve deployed SHA & start time
        id: source
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: 🟠 · 🧾 Track deployment started
        continue-on-error: true
        uses: vezham/vx-deployer/.github/actions/deployment/comment-promotion@timeline
        with:
          GIT_REPO: ${{ env.REPO }}
          GIT_SHA: ${{ steps.source.outputs.sha }}
          APP_NAME: ${{ env.VX_APP_NAME }}
          APP_ENV: ${{ inputs.TRACK_ENV }}
          STATUS: in_progress
          GITHUB_TOKEN: ${{ steps.source-auth.outputs.token }}
          PRODUCTION_TARGET: ${{ inputs.PRODUCTION_TARGET }}
        if: ${{ !inputs.IS_REBUILD }}
      - name: 🟠 · ⚙️ Configure app build
        uses: vezham/vx-deployer/.github/actions/deployment/configure-web-app@timeline
        with:
          APP_NAME: ${{ inputs.APP_NAME }}
          APP_PATH: ${{ inputs.APP_PATH }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          TRACK_ENV: ${{ inputs.TRACK_ENV }}
          APP_ENV: ${{ inputs.APP_ENV }}
          RELEASE_CHANNEL: ${{ inputs.RELEASE_CHANNEL }}
          IS_DEBUG: ${{ inputs.IS_DEBUG }}
          PRODUCTION_TARGET: ${{ inputs.PRODUCTION_TARGET }}
          BUILD_VALUES: ${{ inputs.BUILD_VALUES }}
          BUILD_SECRET_VALUES: ${{ inputs.BUILD_SECRET_VALUES }}
          AVAILABLE_SECRETS: ${{ secrets.BUILD_SECRETS || '{}' }}
      - name: 🟠 · 🧩 Setup Node & pnpm
        uses: vezham/vx-deployer/.github/actions/common/setup-install@timeline
        with:
          APP_PATH: ${{ inputs.APP_PATH }}
          HEROUI_AUTH_TOKEN: ${{ secrets.HEROUI_AUTH_TOKEN }}
      - name: 🟠 · 🏗️ Generate build
        uses: vezham/vx-deployer/.github/actions/nx/gen-build@timeline
      - name: 🟠 · 🔥 Deploy to Firebase
        id: deployment
        uses: vezham/vx-deployer/.github/actions/cloud-providers/firebase@timeline
        with:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          COMMENT_DEPLOYMENT: 'false'
      - name: 🔵 · 🧾 Capture deployment status
        id: result
        if: ${{ always() && (steps.source.outputs.sha != '' || inputs.TRACK_ENV != 'tva') }}
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          DEPLOYMENT_STATUS: ${{ job.status }}
        run: |
          echo "status=$DEPLOYMENT_STATUS" >> "$GITHUB_OUTPUT"
          echo "finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: 🟠 · 🧾 Track deployment result
        if: ${{ always() && !inputs.IS_REBUILD && steps.source-auth.outputs.token != '' && (steps.source.outputs.sha != '' || inputs.TRACK_ENV != 'tva') }}
        continue-on-error: true
        uses: vezham/vx-deployer/.github/actions/deployment/comment-promotion@timeline
        with:
          GIT_REPO: ${{ env.REPO }}
          GIT_SHA: ${{ steps.source.outputs.sha || inputs.GIT_REF }}
          APP_NAME: ${{ env.VX_APP_NAME }}
          APP_ENV: ${{ inputs.TRACK_ENV }}
          STATUS: ${{ steps.result.outputs.status }}
          PREVIEW_URL: ${{ steps.deployment.outputs.preview_url }}
          PREVIEW_EXPIRES_AT: ${{ steps.deployment.outputs.preview_expires_at }}
          LIVE_URL: ${{ steps.deployment.outputs.live_url }}
          GITHUB_TOKEN: ${{ steps.source-auth.outputs.token }}
          PRODUCTION_TARGET: ${{ inputs.PRODUCTION_TARGET }}
      - name: 🟠 · 📦 Capture public result metadata
        id: metadata
        if: ${{ always() && inputs.TRACK_ENV != 'tva' && github.repository == inputs.JOURNAL_REPO && steps.result.outputs.status != '' }}
        uses: vezham/vx-deployer/.github/actions/deployment/capture-deployment-result@timeline
        with:
          GIT_REPO: ${{ env.REPO }}
          GIT_SHA: ${{ steps.source.outputs.sha || inputs.GIT_REF }}
          APP_NAME: ${{ env.VX_APP_NAME }}
          APP_ENV: ${{ inputs.TRACK_ENV }}
          STATUS: ${{ steps.result.outputs.status }}
          STARTED_AT: ${{ steps.source.outputs.started_at }}
          FINISHED_AT: ${{ steps.result.outputs.finished_at }}
          PREVIEW_URL: ${{ steps.deployment.outputs.preview_url }}
          PREVIEW_EXPIRES_AT: ${{ steps.deployment.outputs.preview_expires_at }}
          LIVE_URL: ${{ steps.deployment.outputs.live_url }}
          PRODUCTION_TARGET: ${{ inputs.PRODUCTION_TARGET }}
          IS_REBUILD: ${{ inputs.IS_REBUILD }}
          CATEGORY: ${{ inputs.CATEGORY }}
      - name: 🟠 · 📤 Upload public result metadata
        id: metadata-artifact
        if: ${{ always() && steps.metadata.outputs.path != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.metadata.outputs.name }}
          path: ${{ steps.metadata.outputs.path }}
          if-no-files-found: error
          retention-days: 7
    outputs:
      artifact_id: ${{ steps.metadata-artifact.outputs.artifact-id }}
  monthly:
    name: 📅 Prepare monthly history
    needs: bnd
    if: ${{ always() && inputs.TRACK_ENV != 'tva' && github.repository == inputs.JOURNAL_REPO && needs.bnd.outputs.artifact_id != '' }}
    runs-on: ubuntu-latest
    concurrency:
      group: deployment-monthly-${{ github.repository }}-${{ inputs.CATEGORY }}
      cancel-in-progress: false
      queue: max
    outputs:
      issue_number: ${{ steps.monthly.outputs.issue_number }}
    steps:
      - name: 🟠 · 🔎 Find public result artifact
        id: result-artifact
        uses: vezham/vx-deployer/.github/actions/deployment/read-deployment-result@timeline
        with:
          ARTIFACT_ID: ${{ needs.bnd.outputs.artifact_id }}
      - name: 🟠 · 📥 Download public result metadata
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: ${{ runner.temp }}/deployment-result
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          name: ${{ steps.result-artifact.outputs.name }}
      - name: 🟠 · 📅 Prepare monthly category issue
        id: monthly
        uses: vezham/vx-deployer/.github/actions/deployment/prepare-monthly-journal@timeline
        with:
          JOURNAL_REPO: ${{ inputs.JOURNAL_REPO }}
          GIT_REPO: ${{ inputs.GIT_REPO }}
          APP_NAME: ${{ inputs.APP_NAME }}
          CATEGORY: ${{ inputs.CATEGORY }}
          APP_ENV: ${{ inputs.TRACK_ENV }}
          PRODUCTION_TARGET: ${{ inputs.PRODUCTION_TARGET }}
          IS_REBUILD: ${{ inputs.IS_REBUILD }}
          RESULT_FILE: ${{ runner.temp }}/deployment-result/result.json
  journal:
    name: 🧾 Record deployment history & state
    needs:
      - bnd
      - monthly
    if: ${{ always() && inputs.TRACK_ENV != 'tva' && github.repository == inputs.JOURNAL_REPO && needs.bnd.outputs.artifact_id != '' && needs.monthly.outputs.issue_number != '' }}
    runs-on: ubuntu-latest
    concurrency:
      group: deployment-journal-${{ github.repository }}-${{ inputs.APP_NAME }}
      cancel-in-progress: false
      queue: max
    steps:
      - name: 🟠 · 🔎 Find public result artifact
        id: result-artifact
        uses: vezham/vx-deployer/.github/actions/deployment/read-deployment-result@timeline
        with:
          ARTIFACT_ID: ${{ needs.bnd.outputs.artifact_id }}
      - name: 🟠 · 📥 Download public result metadata
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: ${{ runner.temp }}/deployment-result
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          name: ${{ steps.result-artifact.outputs.name }}
      - name: 🟠 · 🧾 Append monthly history & update app state
        if: ${{ always() }}
        uses: vezham/vx-deployer/.github/actions/deployment/deployment-journal@timeline
        with:
          JOURNAL_REPO: ${{ env.DEPLOYMENT_JOURNAL_REPO }}
          GIT_REPO: ${{ env.REPO }}
          APP_NAME: ${{ env.VX_APP_NAME }}
          APP_ENV: ${{ inputs.TRACK_ENV }}
          GITHUB_TOKEN: ${{ github.token }}
          PRODUCTION_TARGET: ${{ inputs.PRODUCTION_TARGET }}
          JOURNAL_ISSUE: ${{ inputs.JOURNAL_ISSUE }}
          IS_REBUILD: ${{ inputs.IS_REBUILD }}
          RESULT_FILE: ${{ runner.temp }}/deployment-result/result.json
          CATEGORY: ${{ inputs.CATEGORY }}
          MONTHLY_ISSUE: ${{ needs.monthly.outputs.issue_number }}
