name: home-mock | deployer

on:
  workflow_call:
    inputs:
      CALLER:
        required: true
        type: string

jobs:
  tva:
    name: dc/TVA
    if: ${{ inputs.CALLER == 'timeline' }}
    uses: vezham/vx-fe-deployer/.github/workflows/vezham-home-mock.helper.yml@timeline
    secrets:
      VERCEL_SA_KEY: ${{ secrets.PLAYGROUND_MOCK_TVA_VERCEL_SA_KEY }}
    with:
      GIT_BRANCH: ${{ inputs.CALLER }}
      APP_NAME: home-mock
      IS_DEBUG: true
      IS_BETA: true
