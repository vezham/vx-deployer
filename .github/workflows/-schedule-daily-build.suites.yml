name: daily-build/suites | schedule

on:
  schedule:
    - cron: '30 23 * * 0,3,5'

jobs:
  # v0xFE-apps-suites
  hq:
    name: scheduler | hq
    uses: vezham/vx-fe-deployer/.github/workflows/hq.yml@timeline
    secrets: inherit
    with:
      CALLER: scheduler

  one:
    name: scheduler | one
    uses: vezham/vx-fe-deployer/.github/workflows/one.yml@timeline
    secrets: inherit
    with:
      CALLER: scheduler
