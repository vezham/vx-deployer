name: 🏗️ Build web app
description: Nx for Gen apps build to deploy

runs:
  using: composite
  steps:
    - name: 🔵 · ⚙️ Generate deployment configuration
      continue-on-error: true
      shell: bash
      run: |
        pnpm nx run ${{ env.VX_APP_NAME }}:deploy:generate

    - name: 🔵 · 🏗️ Build app
      shell: bash
      run: |
        pnpm nx run ${{ env.VX_APP_NAME }}:build

    - name: 🟠 · 📦 Upload npm failure logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: npm-logs
        path: ~/.npm/_logs
