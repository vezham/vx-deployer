name: firebase as cloud-providers
description: Sets up Firebase as Cloud Provider

inputs:
  GCP_SA_KEY:
    required: true
    type: string

  COMMENT_DEPLOYMENT:
    description: Publish a separate deployment URL commit comment
    default: 'true'

outputs:
  preview_url:
    description: Deployed preview URL
    value: ${{ steps.gcp-preview-url.outputs.value }}
  preview_expires_at:
    description: Preview expiry timestamp
    value: ${{ steps.gcp-preview.outputs.expire_time }}
  live_url:
    description: Deployed live URL
    value: ${{ steps.deployment-url.outputs.live_url }}

runs:
  using: composite
  steps:
    # wjdlz/TODO: ci-setup | fetch-credentials - via vezham CI host
    - name: ci-setup | extract $ENV_TOKENS
      uses: vezham/vx-deployer/.github/actions/cloud-providers/firebase-extract-credentials@timeline
      with:
        GCP_SA_KEY: ${{ inputs.GCP_SA_KEY }}

    - name: cloud-setup | firebase
      shell: bash
      run: |
        bash ${{ github.action_path }}/bin/main.sh ${{ env.VX_APP_PATH }}

    - name: cloud-cli | gcp/preview
      uses: FirebaseExtended/action-hosting-deploy@v0
      id: gcp-preview
      with:
        expires: 7d
        channelId: ${{ env.DX_APP_URL }}
        repoToken: ${{ env.GITHUB_TOKEN }}
        projectId: ${{ env.GCP_PROJECT_ID }}
        firebaseServiceAccount: ${{ inputs.GCP_SA_KEY }}
        disableComment: ${{ inputs.COMMENT_DEPLOYMENT != 'true' }}
        # entryPoint: ${{ env.ENTRY_POINT }}

    - name: setup | fetch preview url
      uses: mad9000/actions-find-and-replace-string@5
      id: gcp-preview-url
      with:
        source: ${{ steps.gcp-preview.outputs.details_url }}
        find: '***'
        replace: ${{ env.GCP_PROJECT_ID }}

    - name: cloud-cli | gcp/live
      uses: FirebaseExtended/action-hosting-deploy@v0
      id: gcp
      with:
        # expires: 30d
        channelId: live
        # repoToken: ${{ env.GITHUB_TOKEN }}
        projectId: ${{ env.GCP_PROJECT_ID }}
        firebaseServiceAccount: ${{ inputs.GCP_SA_KEY }}
        # entryPoint: ${{ env.ENTRY_POINT }}

    - name: setup | publish live URL
      id: deployment-url
      shell: bash
      run: echo "live_url=https://${GCP_PROJECT_ID}.web.app" >> "$GITHUB_OUTPUT"

    - name: deployer | create commit comment
      if: ${{ inputs.COMMENT_DEPLOYMENT == 'true' }}
      uses: peter-evans/commit-comment@v1
      # - https://${{ env.DX_APP_URL }}
      with:
        body: |
          🚀 ${{ env.VX_APP_NAME }} Build deployed successfully to the following URLs
          - [Preview](${{ steps.gcp-preview-url.outputs.value }}) - ${{ steps.gcp-preview.outputs.expire_time }}
          - [Live Demo](https://${{ env.GCP_PROJECT_ID }}.web.app)

          ---

          [Workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) · Attempt ${{ github.run_attempt }}
