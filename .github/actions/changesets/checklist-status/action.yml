name: changesets for release
description: Sets up Changesets for NPM release

inputs:
  # GITHUB_TOKEN:
  #   required: true
  #   type: string
  NPM_TOKEN:
    required: true
    type: string

runs:
  using: composite
  steps:
    - name: changesets | status
      shell: bash
      run: |
        pnpm changeset status
      env:
        NODE_AUTH_TOKEN: ${{ inputs.NPM_TOKEN }}
