name: Setup Node.js and pnpm
description: Sets up Node.js and pnpm with caching

inputs:
  APP_PATH:
    description: Source app path; select Node from the app package.json or workspace root package.json
    required: false
  NODE_VERSION:
    description: Node version override; existing callers retain their matrix version or Node 22
    required: false
  HEROUI_AUTH_TOKEN:
    required: false
    type: string

runs:
  using: composite
  steps:
    - name: setup | resolve source Node version file
      id: runtime
      if: ${{ inputs.APP_PATH != '' }}
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        SOURCE_APP_PATH: ${{ inputs.APP_PATH }}
        RUNTIME_RESOLVER: ${{ github.action_path }}/bin/runtime.cjs
      run: node "$RUNTIME_RESOLVER"

    - name: setup | pnpm
      uses: pnpm/action-setup@v4
      with:
        version: ${{ matrix.pnpm-version }}

    - name: setup | node env
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.APP_PATH == '' && (inputs.NODE_VERSION || matrix.node-version || 22) || '' }}
        node-version-file: ${{ steps.runtime.outputs.node_version_file }}
        cache: 'pnpm'
        cache-dependency-path: '**/pnpm-lock.yaml'

    # - name: setup | Git User (Deployer)
    #   shell: bash
    #   run: |
    #     git config --global user.email "deployer@vezham.com"
    #     git config --global user.name "Deployer Vezham"

    - name: setup | HeroUI auth token
      shell: bash
      run: echo "HEROUI_AUTH_TOKEN=${{ inputs.HEROUI_AUTH_TOKEN }}" >> "$GITHUB_ENV"

    - name: setup | pnpm install
      shell: bash
      run: pnpm install --frozen-lockfile --ignore-scripts

    - name: setup | Install Pro dependencies
      if: ${{ inputs.HEROUI_AUTH_TOKEN != '' }}
      shell: bash
      env:
        HEROUI_AUTH_TOKEN: ${{ inputs.HEROUI_AUTH_TOKEN }}
      run: |
        pnpm rebuild @heroui-pro/react || true
      # pnpm heroui-pro install --yes || true
      # pnpm rebuild @heroui-pro/react || true
      # test -e node_modules/@heroui-pro/react/dist/css/index.css || find node_modules/@heroui-pro/react -maxdepth 4 -type f

    - name: setup | pnpm version check
      shell: bash
      run: pnpm --version
