name: 'Release Summary'
description: 'Generate and post a release summary for publishing jobs'

inputs:
  actor:
    description: 'Triggering GitHub actor'
    required: true
  token:
    description: 'GitHub token for commenting & checks'
    required: true
  version:
    description: 'Released version'
    required: false
  resolved_version:
    description: 'Version selected by the release runner'
    required: false
  published_count:
    description: 'Successful package publish results; zero for dry runs'
    required: false
  publishable_count:
    description: 'Total publishable workspace packages'
    required: false
  args:
    description: 'Released args'
    required: false
  release_result:
    required: true

runs:
  using: 'composite'
  steps:
    - name: 📝 Generate Release Summary
      id: gen
      shell: bash
      env:
        SUMMARY_VERSION: ${{ inputs.version }}
        SUMMARY_RESOLVED_VERSION: ${{ inputs.resolved_version }}
        SUMMARY_PUBLISHED_COUNT: ${{ inputs.published_count }}
        SUMMARY_PUBLISHABLE_COUNT: ${{ inputs.publishable_count }}
        SUMMARY_ARGS: ${{ inputs.args }}
      run: |
        SUMMARY_MD="summary-release.md"

        result_icon() {
          case "$1" in
            success) echo "✅";;
            failure) echo "❌";;
            skipped) echo "⏭️";;
            cancelled) echo "⚠️";;
            *) echo "❔";;
          esac
        }

        display_status() {
          local value="$1"
          if [ -z "$value" ]; then echo "skipped"; else echo "$value"; fi
        }

        RELEASE=$(display_status "${{ inputs.release_result }}")

        # Determine overall result
        ALL_STATUS="$RELEASE"

        VERSION="$SUMMARY_RESOLVED_VERSION"
        if [ -n "$VERSION" ]; then
          if [ -z "$SUMMARY_VERSION" ]; then
            VERSION="$VERSION (auto / detected)"
          elif [ "$SUMMARY_VERSION" != "$VERSION" ]; then
            VERSION="$VERSION (requested: $SUMMARY_VERSION)"
          fi
        else
          VERSION="${SUMMARY_VERSION:-(auto / detected)}"
        fi

        ARGS="$SUMMARY_ARGS"

        if echo "$ALL_STATUS" | grep -q "failure"; then
          OVERALL="failure"
          OVERALL_STATUS="❌ Release Failed"
          OVERALL_BADGE="🔴 CI Status: Release Failed"
        elif echo "$ALL_STATUS" | grep -q "cancelled"; then
          OVERALL="cancelled"
          OVERALL_STATUS="⚠️ Release Cancelled"
          OVERALL_BADGE="⚠️ CI Status: Release Cancelled"
        else
          OVERALL="success"
          OVERALL_STATUS="🎉 Release Successful"
          OVERALL_BADGE="🟢 CI Status: Release Completed"
        fi

        {
          echo "### ${OVERALL_BADGE}"
          echo ""
          echo "🧾 **Release Results** — ${OVERALL_STATUS}"
          echo ""
          echo "| Key | Value |"
          echo "|------|--------|"
          echo "| 🚀 Release | $(result_icon "$RELEASE") ($RELEASE) |"
          echo "| 🔢 Version | ${VERSION} |"

          if [[ "$SUMMARY_PUBLISHABLE_COUNT" =~ ^[0-9]+$ ]]; then
            PUBLISHED_COUNT="—"
            if [[ "$SUMMARY_PUBLISHED_COUNT" =~ ^[0-9]+$ ]]; then
              PUBLISHED_COUNT="$SUMMARY_PUBLISHED_COUNT"
            fi
            echo "| 📦 Packages published | ${PUBLISHED_COUNT}/${SUMMARY_PUBLISHABLE_COUNT} |"
          fi

          # only include args row if provided
          if [ -n "$ARGS" ]; then
            echo "| ⚙️ Args | ${ARGS} |"
          fi
          
          echo ""
          echo "---"
          echo ""
          echo "[Workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) · Attempt ${{ github.run_attempt }}"
          if [ -n "${{ github.event.pull_request.number }}" ]; then
            echo "🔗 **PR:** #${{ github.event.pull_request.number }} by @${{ inputs.actor }}"
          fi
          echo ""
          echo "🕒 Generated on $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
          echo "Triggered by **@${{ inputs.actor }}**"
        } > "$SUMMARY_MD"

        echo ""
        echo "===== 🧾 RELEASE SUMMARY (${OVERALL_STATUS}) ====="
        cat "$SUMMARY_MD"
        echo "===================================="

        # export outputs for later steps
        echo "summary_path=$SUMMARY_MD" >> "$GITHUB_OUTPUT"
        echo "overall=$OVERALL" >> "$GITHUB_OUTPUT"
        echo "overall_label=$OVERALL_STATUS" >> "$GITHUB_OUTPUT"

    - name: 🟠 · 💬 Update summary on commit
      if: always()
      uses: vezham/vx-deployer/.github/actions/common/comment-ci-summary@timeline
      with:
        token: ${{ inputs.token }}
        summary_path: ${{ steps.gen.outputs.summary_path }}
        kind: release

    - name: 💬 Post Summary to PR (if available)
      if: github.event.pull_request.number != ''
      uses: marocchino/sticky-pull-request-comment@v2
      with:
        header: Release Summary
        path: ${{ steps.gen.outputs.summary_path }}

    - name: 🟩 Create Check Run
      if: always()
      uses: LouisBrunner/checks-action@v2
      with:
        token: ${{ inputs.token }}
        name: '🧾 Release Summary (${{ steps.gen.outputs.overall_label }})'
        conclusion: ${{ steps.gen.outputs.overall }}
        output: |
          {
            "summary": "Release report generated — see PR comment / commit comment for full details."
          }
