name: Upload Logs to artifact
description: Upload the logs for debugging

runs:
  using: composite
  steps:
    - name: logs | e2e
      continue-on-error: true
      shell: bash
      run: |
        mkdir -p .vezham
        mkdir -p dist/.playwright
        cp -R dist/.playwright/ .vezham/playwright/
        echo "logs -> playwright-report"

    - name: logs | audit
      if: always()
      shell: bash
      run: |
        if [ -d test-output/audit ]; then
          mkdir -p .vezham/audit
          cp -R test-output/audit/. .vezham/audit/
        fi

    - name: logs | dir
      if: always()
      shell: bash
      run: |
        mkdir -p .vezham
        cp -R .vezham/ vx-ci/
        echo "logs -> artifact"
        pwd
        ls

    - name: ci-setup | Upload Logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: vx-ci-artifact-${{ github.job }}-${{ github.run_attempt }}
        path: vx-ci/
        retention-days: 30
