name: 🧰 Checkout repository
description: Sets up repo & branch

inputs:
  GIT_REPO:
    required: true
    type: string
  GIT_BRANCH:
    required: true
    type: string

  GIT_TOKEN:
    description: Token with read access to the source repository
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: 🟠 · 🧰 Checkout • ${{ inputs.GIT_REPO }}@${{ inputs.GIT_BRANCH }}
      uses: actions/checkout@v4
      with:
        repository: ${{ inputs.GIT_REPO }}
        ref: ${{ inputs.GIT_BRANCH }}
        token: ${{ inputs.GIT_TOKEN }}
        fetch-depth: 0
