name: Setup checkout
description: Sets up repo & branch

inputs:
  GIT_REPO:
    required: true
    type: string
  GIT_BRANCH:
    required: true
    type: string

runs:
  using: composite
  steps:
    - name: checkout | ${{ inputs.GIT_REPO }}@${{ inputs.GIT_BRANCH }}
      uses: actions/checkout@v4
      with:
        repository: ${{ inputs.GIT_REPO }}
        ref: ${{ inputs.GIT_BRANCH }}
        fetch-depth: 0
