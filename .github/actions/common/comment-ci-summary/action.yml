name: 💬 Update CI commit summary
description: Maintain one commit summary per workflow and summary kind

inputs:
  token:
    description: GitHub token with contents write permission
    required: true
  summary_path:
    description: Path to the generated Markdown summary
    required: true
  kind:
    description: Summary kind (qa, bnd or release)
    required: true

runs:
  using: composite
  steps:
    - name: 🔵 · 💬 Update summary on commit
      uses: actions/github-script@v7
      env:
        CI_SUMMARY_ACTION_PATH: ${{ github.action_path }}
        CI_SUMMARY_PATH: ${{ inputs.summary_path }}
        CI_SUMMARY_KIND: ${{ inputs.kind }}
      with:
        github-token: ${{ inputs.token }}
        script: |
          const { main } = require(`${process.env.CI_SUMMARY_ACTION_PATH}/bin/main.cjs`);
          await main({ github, context, core });
