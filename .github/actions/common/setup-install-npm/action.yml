name: Setup Node.js and pnpm
description: Sets up Node.js and pnpm with caching

inputs:
  NPM_TOKEN:
    required: true
    type: string
  HEROUI_AUTH_TOKEN:
    required: false
    type: string

runs:
  using: composite
  steps:
    - name: setup | pnpm
      uses: pnpm/action-setup@v4
      with:
        version: ${{ matrix.pnpm-version }}

    - name: setup | node env
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version || 22 }}
        registry-url: 'https://registry.npmjs.org'
        cache: 'pnpm'
        cache-dependency-path: '**/pnpm-lock.yaml'
      env:
        NODE_AUTH_TOKEN: ${{ inputs.NPM_TOKEN }}

    - name: npm | Check NPM Auth
      shell: bash
      run: |
        npm whoami
      env:
        NODE_AUTH_TOKEN: ${{ inputs.NPM_TOKEN }}

    - name: setup | Git User (Deployer)
      shell: bash
      run: |
        git config --global user.email "vigneshwaran@vezham.com"
        git config --global user.name "v0xvigneshwaran"

    - name: setup | HeroUI auth token
      shell: bash
      run: echo "HEROUI_AUTH_TOKEN=${{ inputs.HEROUI_AUTH_TOKEN }}" >> "$GITHUB_ENV"

    - name: setup | pnpm install
      shell: bash
      run: pnpm install --frozen-lockfile --ignore-scripts

    - name: setup | Install Pro dependencies
      if: ${{ inputs.HEROUI_AUTH_TOKEN != '' }}
      shell: bash
      env:
        HEROUI_AUTH_TOKEN: ${{ inputs.HEROUI_AUTH_TOKEN }}
      run: |
        pnpm heroui-pro install --yes
        node -e "const fs=require('node:fs');const path='node_modules/@heroui-pro/react/package.json';if(!fs.existsSync(path)){throw new Error('@heroui-pro/react is not installed');}const pkg=JSON.parse(fs.readFileSync(path,'utf8'));if(!(pkg.exports||pkg.main||pkg.module)){throw new Error('@heroui-pro/react runtime entry missing after install');}"
        test -e node_modules/@heroui-pro/react/dist/css/index.css

    - name: setup | pnpm version check
      shell: bash
      run: pnpm --version
