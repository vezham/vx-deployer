name: 🧾 Audit Summary
description: Publish audit score gate results and findings to the job summary and commit

inputs:
  token:
    description: GitHub token with contents write permission for commit comments
    required: true
  report:
    description: Path to the audit runner summary JSON
    default: test-output/audit/summary.json

runs:
  using: composite
  steps:
    - name: 🔵 · 🧾 Generate audit summary
      id: render
      shell: bash
      env:
        AUDIT_REPORT: ${{ inputs.report }}
        AUDIT_MARKDOWN: ${{ runner.temp }}/vx-audit-summary.md
      run: node "$GITHUB_ACTION_PATH/render.cjs"

    - name: 🟠 · 💬 Update Fallow summary on commit
      continue-on-error: true
      uses: vezham/vx-deployer/.github/actions/common/comment-ci-summary@timeline
      with:
        token: ${{ inputs.token }}
        summary_path: ${{ steps.render.outputs.fallow_path }}
        kind: audit-fallow

    - name: 🟠 · 💬 Update React Doctor summary on commit
      continue-on-error: true
      uses: vezham/vx-deployer/.github/actions/common/comment-ci-summary@timeline
      with:
        token: ${{ inputs.token }}
        summary_path: ${{ steps.render.outputs.react_doctor_path }}
        kind: audit-react-doctor
