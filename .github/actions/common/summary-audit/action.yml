name: Audit Summary
description: Publish advisory audit counts to the job summary and commit

inputs:
  token:
    description: GitHub token with contents write permission for commit comments
    required: true
  report:
    description: Path to the audit runner summary JSON
    default: test-output/audit/summary.json

runs:
  using: composite
  steps:
    - name: Generate audit summary
      shell: bash
      env:
        AUDIT_REPORT: ${{ inputs.report }}
        AUDIT_MARKDOWN: ${{ runner.temp }}/vx-audit-summary.md
      run: node "$GITHUB_ACTION_PATH/render.cjs"
    - name: Update tool comments on commit
      continue-on-error: true
      uses: actions/github-script@v7
      env:
        AUDIT_COMMENTS: ${{ runner.temp }}/vx-audit-summary.md.json
      with:
        github-token: ${{ inputs.token }}
        script: |
          const fs = require('node:fs');
          const reports = JSON.parse(fs.readFileSync(process.env.AUDIT_COMMENTS, 'utf8'));
          const comments = await github.paginate(github.rest.repos.listCommentsForCommit, {
            ...context.repo, commit_sha: context.sha, per_page: 100
          });
          for (const [tool, body] of Object.entries(reports)) {
            const marker = `<!-- vx-audit:${tool} -->`;
            const existing = comments.find(comment => comment.user?.type === 'Bot' && comment.user?.login === 'github-actions[bot]' && comment.body?.startsWith(marker));
            if (existing) {
              await github.rest.repos.updateCommitComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.repos.createCommitComment({ ...context.repo, commit_sha: context.sha, body });
            }
          }
