name: 📦 Find deployment result
description: Resolve one result artifact by ID without listing all run artifacts
inputs:
  ARTIFACT_ID:
    required: true
outputs:
  name:
    description: Artifact name for a filtered download
    value: ${{ steps.result.outputs.name }}
runs:
  using: composite
  steps:
    - name: 🔵 · 🔎 Resolve result artifact
      id: result
      uses: actions/github-script@v7
      env:
        ARTIFACT_ID: ${{ inputs.ARTIFACT_ID }}
        API_MODULE: ${{ github.action_path }}/../deployment-journal/bin/api.cjs
      with:
        script: >
          const { respectRateLimits } = require(process.env.API_MODULE);

          respectRateLimits({ github, core });

          const id = Number(process.env.ARTIFACT_ID);

          if (!Number.isSafeInteger(id) || id <= 0) throw new Error('Invalid result artifact ID');

          const { data } = await github.rest.actions.getArtifact({ ...context.repo, artifact_id: id });

          if (data.expired || Number(data.workflow_run?.id) !== Number(context.runId)) throw new Error('Result artifact does not belong to this run or has expired');

          core.setOutput('name', data.name);
