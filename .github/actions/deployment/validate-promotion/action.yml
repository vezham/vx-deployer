name: ✅ Validate promotion source
description: Validate the source commit, destination and preceding successful deployment
inputs:
  GIT_SHA:
    description: Full 40-character source commit SHA
    required: true
  APP_NAME:
    description: Application name used by the promotion tracker
    required: true
  APP_ENV:
    description: Destination environment (dev, qa, preview or production)
    required: true
  GIT_REPO:
    description: Repository containing the source commit
    default: ${{ github.repository }}
  GITHUB_TOKEN:
    description: Token with Contents read and Commit statuses read access to the source repository
    default: ${{ github.token }}
  PROMOTION_PATH:
    description: JSON array of allowed stages; defaults to the full TVA-to-Production order
    required: false
  PRODUCTION_TARGET:
    description: App-specific Production target; empty uses the single default deployment
    default: ''
outputs:
  sha:
    description: Resolved full commit SHA
    value: ${{ steps.commit.outputs.sha }}
  short_sha:
    description: Seven-character commit SHA for display
    value: ${{ steps.commit.outputs.short_sha }}
runs:
  using: composite
  steps:
    - name: 🔵 · ✅ Validate SHA, destination & promotion order
      id: commit
      uses: actions/github-script@v7
      env:
        SOURCE_SHA: ${{ inputs.GIT_SHA }}
        TARGET_ENV: ${{ inputs.APP_ENV }}
        SOURCE_REPO: ${{ inputs.GIT_REPO }}
        PROMOTION_APP: ${{ inputs.APP_NAME }}
        PROMOTION_PATH: ${{ inputs.PROMOTION_PATH }}
        PROMOTION_VALIDATOR: ${{ github.action_path }}/bin/main.cjs
        PRODUCTION_TARGET: ${{ inputs.PRODUCTION_TARGET }}
      with:
        github-token: ${{ inputs.GITHUB_TOKEN }}
        script: |
          const { validatePromotion } = require(process.env.PROMOTION_VALIDATOR);
          await validatePromotion({ github, core });
