name: 🔎 Resolve web app settings
description: Read app settings or discover scheduled deployments across all categories
inputs:
  CONFIG_REPO:
    description: Repository containing the registry
    required: true
  CONFIG_REF:
    description: Commit SHA or branch containing the registry
    required: true
  CONFIG_PATH:
    description: Registry YAML path
    default: .github/config/web-apps.yaml
  APP:
    description: App ID; select APP, CATEGORY or ALL_APPS
  CATEGORY:
    description: Category to list for scheduled rebuilds
  CALLER:
    description: Source branch for automatic TVA builds
  APP_ENV:
    description: Promotion destination
  GITHUB_TOKEN:
    description: Token used to read the registry
    default: ${{ github.token }}
  PRODUCTION_TARGET:
    description: App-specific Production target; empty uses the single default deployment
    default: ''
  ALL_APPS:
    description: Discover all enabled registry apps and Production targets
    default: 'false'
  JOURNAL_REPO:
    description: Optional journal lookup repository for scheduled batches; omit for app resolution
    default: ''
  SCHEDULED_ONLY:
    description: Filter discovery by app schedules on the workflow run creation date in IST
    default: 'false'
outputs:
  apps:
    description: JSON array of enabled app IDs in the selected discovery scope
    value: ${{ steps.resolve.outputs.apps }}
  app:
    description: Application ID
    value: ${{ steps.resolve.outputs.app }}
  repository:
    description: TVA caller repository or configured promotion repository
    value: ${{ steps.resolve.outputs.repository }}
  path:
    description: App path relative to source repository
    value: ${{ steps.resolve.outputs.path }}
  track_environment:
    description: Environment used for source tracking and the journal
    value: ${{ steps.resolve.outputs.track_environment }}
  build_environment:
    description: Build-time V_APP_ENV
    value: ${{ steps.resolve.outputs.build_environment }}
  release_channel:
    description: Build-time V_RELEASE_CHANNEL
    value: ${{ steps.resolve.outputs.release_channel }}
  debug:
    description: Build-time V_IS_DEBUG boolean string
    value: ${{ steps.resolve.outputs.debug }}
  credential_secret:
    description: Name of the destination credential secret, never its value
    value: ${{ steps.resolve.outputs.credential_secret }}
  promotion_path:
    description: JSON array of the app promotion stages
    value: ${{ steps.resolve.outputs.promotion_path }}
  git_ref:
    description: TVA source branch; promotions resolve a SHA separately
    value: ${{ steps.resolve.outputs.git_ref }}
  deployments:
    description: JSON array of app, Production target and category entries
    value: ${{ steps.resolve.outputs.deployments }}
  production_target:
    description: Resolved Production target
    value: ${{ steps.resolve.outputs.production_target }}
  values:
    description: JSON public build variables
    value: ${{ steps.resolve.outputs.values }}
  secret_values:
    description: JSON build variable to secret name references
    value: ${{ steps.resolve.outputs.secret_values }}
  batches:
    description: JSON batches of up to 100 scheduled targets with journal issue references
    value: ${{ steps.resolve.outputs.batches }}
  category:
    description: Registry category derived from the app group
    value: ${{ steps.resolve.outputs.category }}
runs:
  using: composite
  steps:
    - name: 🔵 · 📂 Resolve pnpm package path
      id: package-path
      shell: bash
      env:
        PACKAGE_PATH_SCRIPT: ${{ github.action_path }}/bin/resolve-package-path.cjs
      run: node "$PACKAGE_PATH_SCRIPT"
    - name: 🟠 · 🧩 Setup resolver pnpm
      uses: pnpm/action-setup@v4
      with:
        package_json_file: ${{ steps.package-path.outputs.package_json_file }}
        run_install: false
    - name: 🔵 · 📥 Install resolver dependencies
      shell: bash
      env:
        RESOLVER_SETUP: ${{ github.action_path }}/bin/setup.sh
      run: bash "$RESOLVER_SETUP"
    - name: 🔵 · 📖 Read registry & select deployments
      id: resolve
      uses: actions/github-script@v7
      env:
        RESOLVER_PATH: ${{ github.action_path }}/bin/main.cjs
        CONFIG_REPO: ${{ inputs.CONFIG_REPO }}
        CONFIG_REF: ${{ inputs.CONFIG_REF }}
        CONFIG_PATH: ${{ inputs.CONFIG_PATH }}
        APP: ${{ inputs.APP }}
        CATEGORY: ${{ inputs.CATEGORY }}
        CALLER: ${{ inputs.CALLER }}
        APP_ENV: ${{ inputs.APP_ENV }}
        PRODUCTION_TARGET: ${{ inputs.PRODUCTION_TARGET }}
        CALLER_REPO: ${{ inputs.CALLER != '' && github.repository || '' }}
        ALL_APPS: ${{ inputs.ALL_APPS }}
        JOURNAL_REPO: ${{ inputs.JOURNAL_REPO }}
        SCHEDULED_ONLY: ${{ inputs.SCHEDULED_ONLY }}
      with:
        github-token: ${{ inputs.GITHUB_TOKEN }}
        script: |
          const { main } = require(process.env.RESOLVER_PATH);
          await main({ github, core });
