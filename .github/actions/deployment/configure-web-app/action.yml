name: Configure web app build
description: Write and export app/environment/target values after source checkout
inputs:
  APP_NAME:
    required: true
  APP_PATH:
    required: true
  SOURCE_SHA:
    required: true
  TRACK_ENV:
    required: true
  APP_ENV:
    required: true
  RELEASE_CHANNEL:
    required: true
  IS_DEBUG:
    required: true
  PRODUCTION_TARGET:
    default: ''
  BUILD_VALUES:
    description: JSON mapping of public build variables
    default: '{}'
  BUILD_SECRET_VALUES:
    description: JSON mapping of build variables to Actions secret names
    default: '{}'
  AVAILABLE_SECRETS:
    description: Secret JSON supplied by the caller; only referenced values are used
    default: '{}'
runs:
  using: composite
  steps:
    - uses: actions/github-script@v7
      env:
        CONFIGURE_SCRIPT: ${{ github.action_path }}/bin/main.cjs
        APP_NAME: ${{ inputs.APP_NAME }}
        APP_PATH: ${{ inputs.APP_PATH }}
        SOURCE_SHA: ${{ inputs.SOURCE_SHA }}
        TRACK_ENV: ${{ inputs.TRACK_ENV }}
        APP_ENV: ${{ inputs.APP_ENV }}
        RELEASE_CHANNEL: ${{ inputs.RELEASE_CHANNEL }}
        IS_DEBUG: ${{ inputs.IS_DEBUG }}
        PRODUCTION_TARGET: ${{ inputs.PRODUCTION_TARGET }}
        BUILD_VALUES: ${{ inputs.BUILD_VALUES }}
        BUILD_SECRET_VALUES: ${{ inputs.BUILD_SECRET_VALUES }}
        AVAILABLE_SECRETS: ${{ inputs.AVAILABLE_SECRETS }}
      with:
        script: |
          const { configureWebApp } = require(process.env.CONFIGURE_SCRIPT);
          configureWebApp({ core });
