name: 🧭 Sync promotion choices
description: Generate or check promotion app choices filtered by category

inputs:
  REGISTRY_PATH:
    description: Registry path relative to the checked-out repository
    default: .github/config/web-apps.yaml
  WORKFLOW_PATH:
    description: Promotion workflow containing the generated choice block
    default: .github/workflows/promote.yml
  MODE:
    description: Check for drift or write generated choices (check or write)
    default: check
  CATEGORY:
    description: Category filter for one entry workflow; empty lists all categories
    default: ''
  ALL_CATEGORIES:
    description: Check or regenerate every category promotion entry workflow
    default: 'false'
  WORKFLOW_DIRECTORY:
    description: Directory containing category promotion entry workflows
    default: .github/workflows

runs:
  using: composite
  steps:
    - name: 🔵 · 📂 Resolve pnpm package path
      id: package-path
      shell: bash
      env:
        PACKAGE_PATH_SCRIPT: ${{ github.action_path }}/../resolve-web-app/bin/resolve-package-path.cjs
      run: node "$PACKAGE_PATH_SCRIPT"

    - name: 🟠 · 🧩 Setup generator pnpm
      uses: pnpm/action-setup@v4
      with:
        package_json_file: ${{ steps.package-path.outputs.package_json_file }}
        run_install: false

    - name: 🔵 · 📥 Install generator dependencies
      shell: bash
      env:
        RESOLVER_SETUP: ${{ github.action_path }}/../resolve-web-app/bin/setup.sh
      run: bash "$RESOLVER_SETUP"

    - name: 🔵 · 🧭 Sync promotion app choices
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        CHOICES_SCRIPT: ${{ github.action_path }}/../resolve-web-app/bin/sync-choices.cjs
        REGISTRY_PATH: ${{ inputs.REGISTRY_PATH }}
        WORKFLOW_PATH: ${{ inputs.WORKFLOW_PATH }}
        MODE: ${{ inputs.MODE }}
        CATEGORY: ${{ inputs.CATEGORY }}
        ALL_CATEGORIES: ${{ inputs.ALL_CATEGORIES }}
        WORKFLOW_DIRECTORY: ${{ inputs.WORKFLOW_DIRECTORY }}
      run: node "$CHOICES_SCRIPT"
