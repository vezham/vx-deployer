name: Track promotion progress
description: Maintain one environment deployment tracker on the source commit

inputs:
  GIT_REPO:
    description: Repository containing the source commit
    required: true
  GIT_SHA:
    description: Full source commit SHA
    required: true
  APP_NAME:
    description: Application being deployed
    required: true
  APP_ENV:
    description: Tracker environment (tva, dev, qa, preview or production)
    required: true
  STATUS:
    description: Deployment status (in_progress, success, failure or cancelled)
    required: true
  PREVIEW_URL:
    description: Preview URL to record after successful deployment
    required: false
  PREVIEW_EXPIRES_AT:
    description: Preview expiry timestamp
    required: false
  LIVE_URL:
    description: Live URL to record after successful deployment
    required: false
  GITHUB_TOKEN:
    description: Token with Contents write and Commit statuses write access to the source repository
    default: ${{ github.token }}
  PRODUCTION_TARGET:
    description: App-specific Production target; empty uses the single default deployment
    default: ''

outputs:
  comment_id:
    description: Shared tracker comment ID
    value: ${{ steps.comment.outputs.comment_id }}
  comment_url:
    description: Link to the shared tracker
    value: ${{ steps.comment.outputs.comment_url }}

runs:
  using: composite
  steps:
    - name: Update source commit tracker
      id: comment
      uses: actions/github-script@v7
      env:
        SOURCE_REPO: ${{ inputs.GIT_REPO }}
        SOURCE_SHA: ${{ inputs.GIT_SHA }}
        PROMOTION_APP: ${{ inputs.APP_NAME }}
        TARGET_ENV: ${{ inputs.APP_ENV }}
        PROMOTION_STATUS: ${{ inputs.STATUS }}
        PREVIEW_URL: ${{ inputs.PREVIEW_URL }}
        PREVIEW_EXPIRES_AT: ${{ inputs.PREVIEW_EXPIRES_AT }}
        LIVE_URL: ${{ inputs.LIVE_URL }}
        PROMOTION_ACTION_PATH: ${{ github.action_path }}
        PRODUCTION_TARGET: ${{ inputs.PRODUCTION_TARGET }}
      with:
        github-token: ${{ inputs.GITHUB_TOKEN }}
        script: |
          const { updateTracker } = require(`${process.env.PROMOTION_ACTION_PATH}/bin/main.cjs`);
          await updateTracker({ github, context, core });
